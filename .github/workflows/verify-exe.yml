name: Verify EXE Enforcement

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Assert public authz present and private renker_core absent
        run: >
          python -c "import importlib.util as u; assert u.find_spec('renker_core_authz') is not None,
          'renker_core_authz missing'; assert u.find_spec('renker_core') is None,
          'private renker_core should NOT be a dependency'; print('deps OK: authz present, private core absent')"

      - name: Build RENCORA.exe
        run: pyinstaller main.spec --noconfirm

      - name: EXE self-report
        run: dist\RENCORA\RENCORA.exe --guard-check info

      - name: Black-box enforcement matrix against the real RENCORA.exe
        run: python verification\bb_runner.py dist\RENCORA\RENCORA.exe --guard-check

      - name: Upload black-box results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exe-enforcement-results
          path: bb_results.json
          if-no-files-found: warn
