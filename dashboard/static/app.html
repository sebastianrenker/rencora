<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RENCORA AI Dashboard</title>
  <!-- AES-GCM encryption now uses the browser's native window.crypto.subtle
       (WebCrypto) API instead of CryptoJS/AES-CBC, so this external script
       is no longer needed. -->

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=JetBrains+Mono:wght@400;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── SCANLINES overlay ── */
    body::after {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 9999;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0.08) 0px, rgba(0,0,0,0.08) 1px,
        transparent 1px, transparent 3px
      );
    }
    /* ── Green glow on accent elements ── */
    :root {
      --bg:      #131019;
      --surface: rgba(255,255,255,0.045);
      --border:  rgba(255,255,255,0.08);
      --accent:  #8a2be2;
      --adim:    rgba(138,43,226,0.16);
      --text:    #e8e4f2;
      --muted:   #8f87a3;
      --green:   #b980ff;
      --gdim:    rgba(185,128,255,0.15);
    }
    html, body {
      height: 100%;
      background:
        radial-gradient(ellipse 70% 60% at 50% 42%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%),
        repeating-linear-gradient(0deg, color-mix(in srgb, var(--accent) 4%, transparent) 0 1px, transparent 1px 44px),
        repeating-linear-gradient(90deg, color-mix(in srgb, var(--accent) 4%, transparent) 0 1px, transparent 1px 44px),
        var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      flex-shrink: 0; display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      background: rgba(0,10,0,0.97);
      box-shadow: 0 1px 0 rgba(0,255,65,0.12);
    }
    .logo {
      display: flex; align-items: center; gap: 9px;
    }
    .logo img { width: 30px; height: 30px; object-fit: contain; }
    .logo .logo-text {
      font-family: 'Orbitron', 'JetBrains Mono', sans-serif;
      font-size: 14px; font-weight: 800; letter-spacing: 3px;
      text-shadow: 0 0 10px color-mix(in srgb, var(--accent) 65%, transparent),
                   0 0 26px color-mix(in srgb, var(--accent) 35%, transparent);
      display: flex; flex-direction: column; line-height: 1.15;
    }
    .logo em { color: var(--accent); font-style: normal; text-shadow: 0 0 12px rgba(0,255,65,0.7); }
    .logo .brandtag {
      font-family: 'Orbitron', sans-serif; font-weight: 600;
      font-size: 7px; letter-spacing: 2.5px; color: var(--muted);
      text-transform: uppercase;
    }
    .pill {
      display: flex; align-items: center; gap: 6px; padding: 4px 11px;
      border-radius: 99px; background: var(--surface); border: 1px solid var(--border);
      font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--muted); transition: all 0.3s;
    }
    .pill.on { background: var(--gdim); border-color: rgba(34,197,94,0.3); color: var(--green); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); transition: background 0.3s; }
    .pill.on .dot { background: var(--green); animation: blink 2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .spacer { flex: 1; }
    .clock { font-size: 11px; color: var(--muted); letter-spacing: 1px; white-space: nowrap; }
    .enc-badge {
      font-size: 9px; font-weight: 700; letter-spacing: 1.5px; padding: 3px 8px;
      border-radius: 4px; display: none;
    }
    .enc-badge.on  { display: block; background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.25); color: var(--green); }
    .enc-badge.off { display: block; background: rgba(255,100,100,0.08); border: 1px solid rgba(255,100,100,0.2); color: #f87171; }
    .url { font-size: 10px; font-family: monospace; color: var(--muted); padding: 4px 9px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; }

    /* ── DASHBOARD GRID ── */
    .grid {
      flex: 1; min-height: 0; overflow: hidden;
      display: grid; grid-template-columns: 250px minmax(360px, 1fr) 320px;
      gap: 12px; padding: 12px;
    }
    .col { display: flex; flex-direction: column; gap: 12px; min-height: 0; }

    /* ── PANELS (System Monitor / Activity Log / World Map) ── */
    .panel {
      background: linear-gradient(180deg, var(--surface), rgba(0,0,0,0.16));
      border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
      border-radius: 12px;
      padding: 12px; display: flex; flex-direction: column; min-height: 0;
      box-shadow:
        0 0 14px color-mix(in srgb, var(--accent) 16%, transparent),
        0 4px 18px rgba(0,0,0,0.30),
        inset 0 1px 0 rgba(255,255,255,0.03);
    }
    .gauge-row { display: flex; gap: 6px; margin-bottom: 12px; }
    .gauge { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; }
    .gauge svg { width: 54px; height: 54px; transform: rotate(-90deg); }
    .gauge-track { fill: none; stroke: var(--border); stroke-width: 5; }
    .gauge-fill {
      fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round;
      stroke-dasharray: 163.36; stroke-dashoffset: 163.36;
      transition: stroke-dashoffset 0.5s ease;
      filter: drop-shadow(0 0 4px rgba(0,255,65,0.5));
    }
    .gauge-label {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; pointer-events: none;
    }
    .gauge-label b { display: block; font-size: 13px; color: var(--accent); font-weight: 700; }
    .gauge-label span { font-size: 7px; color: var(--muted); letter-spacing: 1.2px; }

    .panel-net { flex-shrink: 0; }
    .net-spark { width: 100%; height: 40px; display: block; }
    .net-spark polyline { fill: none; stroke-width: 1.6; }
    #net-spark-sent { stroke: var(--accent); filter: drop-shadow(0 0 3px rgba(0,255,65,0.5)); }
    #net-spark-recv { stroke: #00d9ff; filter: drop-shadow(0 0 3px rgba(0,217,255,0.5)); }
    .net-legend { display: flex; justify-content: space-between; margin-top: 8px; font-size: 10px; color: var(--muted); }
    .net-legend b { color: var(--text); font-weight: 700; margin-left: 4px; }
    .net-legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }
    .dot-sent { background: var(--accent); }
    .dot-recv { background: #00d9ff; }
    .panel-head {
      font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between;
    }
    .live-dot { color: #ff4433; font-size: 9px; letter-spacing: 1px; animation: blink 1.4s infinite; }
    .mini-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      font-size: 11px; padding: 3px 9px; border-radius: 6px; cursor: pointer; letter-spacing: 1px;
    }
    .mini-btn:hover { color: var(--accent); border-color: var(--accent); }

    .stat-row { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; margin-bottom: 3px; color: var(--muted); }
    .stat-row b { color: var(--accent); font-weight: 700; }
    .meter { height: 4px; background: var(--border); border-radius: 2px; margin-bottom: 9px; overflow: hidden; }
    .meter-bar { height: 100%; width: 0%; background: var(--accent); border-radius: 2px; transition: width 0.4s ease; }

    .panel-log { flex: 1; }
    .activity { flex: 1; min-height: 60px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; font-size: 10.5px; }
    .activity::-webkit-scrollbar { width: 3px; }
    .activity::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .activity .a-line { color: var(--muted); line-height: 1.5; }
    .activity .a-time { color: var(--accent); margin-right: 7px; opacity: 0.8; }

    .panel-map { flex: 1; min-height: 240px; padding: 0; overflow: hidden; }
    .panel-map .panel-head { padding: 10px 12px 8px; margin-bottom: 0; }
    .globe-frame { flex: 1; width: 100%; border: none; min-height: 200px; }

    /* ── CENTER: chat feed + command console ── */
    .col-center { overflow: hidden; }
    #feed { flex: 1; overflow-y: auto; padding: 14px 4px 8px; display: flex; flex-direction: column; gap: 10px; }
    #feed::-webkit-scrollbar { width: 3px; }
    #feed::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.55; animation: pop 0.18s ease; }
    @keyframes pop { from { opacity:0; transform:translateY(4px); } }
    .msg-j   { align-self:flex-start; background:var(--adim);   border:1px solid rgba(99,102,241,0.18); border-bottom-left-radius:4px; }
    .msg-u   { align-self:flex-end;   background:var(--surface); border:1px solid var(--border);        border-bottom-right-radius:4px; }
    .lbl { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:0.45; margin-bottom:4px; }
    .msg-j .lbl { color:var(--accent); }
    .msg-u .lbl { color:var(--muted); text-align:right; }

    /* ── FILE CARD ── */
    .msg-file {
      align-self: flex-end;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; border-bottom-right-radius: 4px;
      padding: 11px 14px; display: flex; align-items: center; gap: 12px;
      max-width: 82%; animation: pop 0.18s ease;
    }
    .fc-icon { font-size: 26px; flex-shrink: 0; }
    .fc-meta { flex: 1; min-width: 0; }
    .fc-lbl  { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:0.45; color:var(--muted); margin-bottom:4px; }
    .fc-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fc-size { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .fc-bar-wrap { height: 3px; background: var(--border); border-radius: 2px; margin-top: 7px; overflow: hidden; }
    .fc-bar { height: 100%; width: 0%; background: var(--accent); border-radius: 2px; transition: width 0.12s linear; }
    .fc-status { font-size: 10px; font-weight: 700; letter-spacing: 1px; flex-shrink: 0; color: var(--muted); }
    .fc-status.done { color: var(--green); }
    .fc-status.err  { color: #f87171; }
    .fc-dl { display:block; margin-top:6px; font-size:11px; color:var(--accent); text-decoration:none; font-weight:600; }
    .fc-dl:hover { opacity: 0.8; }

    /* ── FOOTER (command console) ── */
    footer { flex-shrink:0; padding:10px 4px; border-top:1px solid var(--border); display:flex; gap:8px; align-items:center; }
    #inp { flex:1; padding:11px 14px; background:var(--surface); border:1.5px solid var(--border); border-radius:12px; color:var(--text); font-size:14px; outline:none; transition:border-color 0.15s; }
    #inp:focus { border-color: var(--accent); }
    #inp::placeholder { color: var(--muted); }
    .btn { padding:11px 15px; border:none; border-radius:12px; font-size:11px; font-weight:700; letter-spacing:1.5px; cursor:pointer; transition:opacity 0.15s,transform 0.1s; }
    .btn:active { transform: scale(0.96); }
    .btn:hover  { opacity: 0.82; }
    .btn-send {
      background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 70%, #000));
      color: #000; font-weight: 700;
      box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 55%, transparent);
    }
    .btn-wake { background:var(--surface); border:1px solid var(--border); color:var(--muted); display:none; }
    .btn-wake.show { display:block; color:var(--green); border-color:rgba(34,197,94,0.35); }
    .btn-attach {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 11px 13px; font-size: 16px; line-height: 1; border-radius: 12px;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s; display: flex;
      align-items: center; justify-content: center; flex-shrink: 0;
    }
    .btn-attach:hover  { opacity: 0.82; border-color: var(--accent); color: var(--accent); }
    .btn-attach:active { transform: scale(0.96); }
    .btn-brain {
      background: rgba(0,255,65,0.06); border: 1px solid rgba(0,255,65,0.3); color: var(--accent);
      padding: 11px 13px; font-size: 16px; line-height: 1; border-radius: 12px;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s; display: flex;
      align-items: center; justify-content: center; flex-shrink: 0;
      box-shadow: 0 0 8px rgba(0,255,65,0.15);
    }
    .btn-brain:hover  { box-shadow: 0 0 14px rgba(0,255,65,0.35); }
    .btn-brain:active { transform: scale(0.96); }
    .msg-file.sb { border-color: rgba(0,255,65,0.35); background: rgba(0,255,65,0.05); }
    .msg-file.sb .fc-lbl { color: var(--accent); }

    /* ── MIC BUTTON ── */
    #mic-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 11px 13px; font-size: 16px; line-height: 1; border-radius: 12px;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s, background 0.2s, border-color 0.2s;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    #mic-btn:hover  { opacity: 0.82; border-color: var(--accent); color: var(--accent); }
    #mic-btn:active { transform: scale(0.96); }
    #mic-btn.recording {
      background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.45); color: #ef4444;
      animation: mic-pulse 1s ease-in-out infinite;
    }
    #mic-btn.unsupported { opacity: 0.3; cursor: not-allowed; }
    @keyframes mic-pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.65;transform:scale(0.97)} }

    /* ── TOAST ── */
    #toast {
      position:fixed; top:66px; left:50%; transform:translateX(-50%) translateY(-8px);
      background:rgba(34,197,94,0.16); border:1px solid rgba(34,197,94,0.4);
      color:var(--green); font-size:12px; font-weight:700; letter-spacing:1px;
      padding:7px 18px; border-radius:99px;
      opacity:0; transition:opacity 0.22s,transform 0.22s;
      pointer-events:none; white-space:nowrap; z-index: 10000;
    }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* ── RESPONSIVE: stack panels below ~980px ── */
    @media (max-width: 980px) {
      .grid { grid-template-columns: 1fr; grid-template-rows: auto minmax(320px, 1fr) auto; overflow-y: auto; }
      .col-center { order: 1; }
      .col-left   { order: 2; flex-direction: row; }
      .col-left .panel { flex: 1; }
      .col-left .panel-log { min-height: 160px; }
      .col-right  { order: 3; }
      .panel-map  { min-height: 320px; }
    }
    @media (max-width: 620px) {
      .col-left { flex-direction: column; }
      .clock { display: none; }
      .url { display: none; }
      footer { flex-wrap: wrap; }
      footer #inp { flex-basis: 100%; }
    }
  </style>
</head>
<body>
  <div id="toast"></div>
  <header>
    <div class="logo">
      <img src="/static/icons/rencora_icon.png" alt="Rencora">
      <div class="logo-text"><span class="title">REN<em>CORA</em></span><span class="brandtag">Renker Industries</span></div>
    </div>
    <div class="pill" id="pill"><span class="dot"></span><span id="st">Connecting</span></div>
    <div class="enc-badge" id="enc">AES-256</div>
    <div class="spacer"></div>
    <div class="clock" id="clock"></div>
    <div class="url">__IP__:__PORT__</div>
  </header>

  <div class="grid">
    <aside class="col col-left">
      <section class="panel panel-monitor">
        <div class="panel-head">SYSTEM MONITOR</div>
        <div class="gauge-row">
          <div class="gauge">
            <svg viewBox="0 0 64 64">
              <circle class="gauge-track" cx="32" cy="32" r="26"></circle>
              <circle class="gauge-fill" id="m-cpu-ring" cx="32" cy="32" r="26"></circle>
            </svg>
            <div class="gauge-label"><b id="m-cpu">—</b><span>CPU</span></div>
          </div>
          <div class="gauge">
            <svg viewBox="0 0 64 64">
              <circle class="gauge-track" cx="32" cy="32" r="26"></circle>
              <circle class="gauge-fill" id="m-ram-ring" cx="32" cy="32" r="26"></circle>
            </svg>
            <div class="gauge-label"><b id="m-ram-pct">—</b><span>RAM</span></div>
          </div>
          <div class="gauge">
            <svg viewBox="0 0 64 64">
              <circle class="gauge-track" cx="32" cy="32" r="26"></circle>
              <circle class="gauge-fill" id="m-gpu-ring" cx="32" cy="32" r="26"></circle>
            </svg>
            <div class="gauge-label"><b id="m-gpu-pct">—</b><span>GPU</span></div>
          </div>
        </div>
        <div class="stat-row"><span>RAM USED</span><b id="m-ram">—</b></div>
        <div class="stat-row"><span>TEMP</span><b id="m-temp">—</b></div>
        <div class="stat-row"><span>UPTIME</span><b id="m-uptime">—</b></div>
        <div class="stat-row"><span>PROCESSES</span><b id="m-procs">—</b></div>
      </section>
      <section class="panel panel-net">
        <div class="panel-head">NETWORK</div>
        <svg id="net-spark" class="net-spark" viewBox="0 0 200 40" preserveAspectRatio="none">
          <polyline id="net-spark-sent" points=""></polyline>
          <polyline id="net-spark-recv" points=""></polyline>
        </svg>
        <div class="net-legend">
          <span><i class="dot-sent"></i>UP <b id="net-sent">—</b></span>
          <span><i class="dot-recv"></i>DOWN <b id="net-recv">—</b></span>
        </div>
      </section>
      <section class="panel panel-log">
        <div class="panel-head">ACTIVITY LOG <span class="live-dot">● LIVE</span></div>
        <div id="activity" class="activity"></div>
      </section>
    </aside>

    <main class="col col-center">
      <div id="feed"></div>
      <footer>
        <input id="inp" placeholder="Send a command to RENCORA…" autocomplete="off">
        <label class="btn-attach" for="file-inp" title="Send file">📎</label>
        <input type="file" id="file-inp" multiple accept="*/*" style="display:none">
        <label class="btn-brain" for="brain-inp" title="Save to Second Brain">🧠</label>
        <input type="file" id="brain-inp" accept="*/*" style="display:none">
        <button id="mic-btn" onclick="doMic()" title="Voice command">🎤</button>
        <button class="btn btn-wake" id="wake" onclick="doWake()">WAKE</button>
        <button class="btn btn-send" onclick="doSend()">SEND</button>
      </footer>
    </main>

    <aside class="col col-right">
      <section class="panel panel-map">
        <div class="panel-head">WORLD MAP <button id="map-full-btn" class="mini-btn" title="Fullscreen">⤢ FULLSCREEN</button></div>
        <iframe id="globe-frame" class="globe-frame" src="/globe"></iframe>
      </section>
    </aside>
  </div>

  <script>
    // ── Farbschema vom Server (config/themes.json) anwenden ──────────────────
    function _hexToRgba(hex, a) {
      const n = parseInt(hex.slice(1), 16);
      return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
    }
    fetch('/api/theme').then(r => r.json()).then(t => {
      const s = document.documentElement.style;
      if (t.BG)       s.setProperty('--bg', t.BG);
      if (t.PRI)    { s.setProperty('--accent', t.PRI);
                      s.setProperty('--adim', _hexToRgba(t.PRI, 0.14)); }
      if (t.TEXT)     s.setProperty('--text', t.TEXT);
      if (t.TEXT_DIM) s.setProperty('--muted', t.TEXT_DIM);
      if (t.GREEN)  { s.setProperty('--green', t.GREEN);
                      s.setProperty('--gdim', _hexToRgba(t.GREEN, 0.14)); }
    }).catch(() => {});

    // ── Auth — bearer token ───────────────────────────────────────────────────
    const _authToken  = sessionStorage.getItem('rencora_token');
    const _sessionKey = sessionStorage.getItem('rencora_key');

    if (!_authToken) {
      location.replace('/login');
    }

    function _authHeader() { return { 'Authorization': `Bearer ${_authToken}` }; }
    function _authFetch(url, opts = {}) {
      opts.headers = Object.assign({}, opts.headers, _authHeader());
      return fetch(url, opts);
    }

    // ── AES-256-GCM encryption (native WebCrypto SubtleCrypto) ───────────────
    // Replaces the previous CryptoJS/AES-CBC implementation. GCM is an
    // authenticated cipher mode: the browser and server both derive the
    // same 32-byte key via SHA-256(sessionKey + salt), and every message
    // gets a fresh random 12-byte IV. A tampered payload fails to decrypt
    // on the server instead of silently producing garbage plaintext.
    const _AES_SALT = 'RENCORA-DASHBOARD-v1';
    let _aesCryptoKey = null;   // CryptoKey, set once _initCrypto() resolves

    async function _initCrypto(key) {
      if (!window.crypto || !window.crypto.subtle) return false;
      try {
        const enc = new TextEncoder();
        const digest = await crypto.subtle.digest('SHA-256', enc.encode(key + _AES_SALT));
        _aesCryptoKey = await crypto.subtle.importKey(
          'raw', digest, { name: 'AES-GCM' }, false, ['encrypt']
        );
        return true;
      } catch { return false; }
    }

    async function _encrypt(plaintext) {
      if (!_aesCryptoKey) return null;
      try {
        const iv  = crypto.getRandomValues(new Uint8Array(12));
        const ctBuf = await crypto.subtle.encrypt(
          { name: 'AES-GCM', iv }, _aesCryptoKey, new TextEncoder().encode(plaintext)
        );
        const bytes = new Uint8Array(iv.length + ctBuf.byteLength);
        bytes.set(iv, 0);
        bytes.set(new Uint8Array(ctBuf), iv.length);
        return btoa(String.fromCharCode(...bytes));
      } catch { return null; }
    }

    const encBadge = document.getElementById('enc');
    let _encReady = false;
    const _cryptoInit = (_sessionKey ? _initCrypto(_sessionKey) : Promise.resolve(false))
      .then(ok => {
        _encReady = ok;
        if (ok) { encBadge.className = 'enc-badge on'; }
        else     { encBadge.className = 'enc-badge off'; encBadge.textContent = 'NO ENC'; }
        return ok;
      });

    // ── WebSocket ─────────────────────────────────────────────────────────────
    const feed  = document.getElementById('feed');
    const pill  = document.getElementById('pill');
    const stTxt = document.getElementById('st');
    const wake  = document.getElementById('wake');

    const _wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
    const _wsUrl   = `${_wsProto}://${location.host}/ws?token=${encodeURIComponent(_authToken)}`;
    const ws       = new WebSocket(_wsUrl);

    ws.onopen    = () => { sys('Remote session active.'); toast('Connected to RENCORA'); };
    ws.onclose   = () => sys('Connection lost — refresh to reconnect.');
    ws.onerror   = () => sys('Connection error.');
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'log')           append(m.speaker, m.text);
      if (m.type === 'status')        setStatus(m.state);
      if (m.type === 'wake')          sys('Wake word detected — connecting…');
      if (m.type === 'sys')           sys(m.text);
      if (m.type === 'file_received') _onFileReceived(m);
      if (m.type === 'secondbrain_received') _onSecondBrainReceived(m);
    };

    function setStatus(s) {
      if (s === 'active') {
        pill.className = 'pill on'; stTxt.textContent = 'Active'; wake.classList.remove('show');
      } else {
        pill.className = 'pill'; stTxt.textContent = 'Sleeping'; wake.classList.add('show');
      }
    }

    function append(speaker, text) {
      const d = document.createElement('div');
      if (speaker === 'rencora') {
        d.className = 'msg msg-j';
        d.innerHTML = `<div class="lbl">RENCORA</div>${esc(text)}`;
      } else {
        d.className = 'msg msg-u';
        d.innerHTML = `<div class="lbl">You</div>${esc(text)}`;
      }
      feed.appendChild(d);
      feed.scrollTop = feed.scrollHeight;
    }

    // System/connection events go to the Activity Log panel, keeping the
    // chat feed limited to actual user/assistant conversation.
    function sys(text) {
      const el = document.getElementById('activity');
      if (!el) return;
      const line = document.createElement('div');
      line.className = 'a-line';
      const t = new Date().toLocaleTimeString('de-DE', { hour12: false });
      line.innerHTML = `<span class="a-time">${t}</span>${esc(text)}`;
      el.appendChild(line);
      el.scrollTop = el.scrollHeight;
    }

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── File helpers ──────────────────────────────────────────────────────────
    function _fileIcon(name) {
      const ext = (name.split('.').pop() || '').toLowerCase();
      if (['jpg','jpeg','png','gif','webp','heic','heif','avif','bmp','svg'].includes(ext)) return '🖼️';
      if (['mp4','mov','avi','mkv','webm','m4v','3gp'].includes(ext))                       return '🎬';
      if (['mp3','m4a','wav','flac','aac','ogg','opus'].includes(ext))                      return '🎵';
      if (['pdf'].includes(ext))                                                             return '📋';
      if (['doc','docx','txt','md','rtf','odt'].includes(ext))                              return '📝';
      if (['xls','xlsx','csv','ods'].includes(ext))                                         return '📊';
      if (['ppt','pptx','odp'].includes(ext))                                               return '📑';
      if (['zip','rar','7z','tar','gz','bz2','xz'].includes(ext))                          return '📦';
      if (['apk','exe','dmg','deb','rpm','msi'].includes(ext))                              return '⚙️';
      return '📎';
    }

    function _fmtSize(bytes) {
      if (bytes < 1024)             return bytes + ' B';
      if (bytes < 1024 * 1024)     return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1024 ** 3)       return (bytes / 1024 / 1024).toFixed(1) + ' MB';
      return (bytes / 1024 ** 3).toFixed(2) + ' GB';
    }

    // ── File upload (phone → computer) ────────────────────────────────────────
    function _uploadFile(file) {
      const id = 'fc_' + Date.now() + '_' + Math.random().toString(36).slice(2);

      // Create file card in feed
      const card = document.createElement('div');
      card.className = 'msg-file';
      card.id = id;
      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(file.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Sending</div>
          <div class="fc-name">${esc(file.name)}</div>
          <div class="fc-size">${_fmtSize(file.size)}</div>
          <div class="fc-bar-wrap"><div class="fc-bar" id="${id}_bar"></div></div>
        </div>
        <div class="fc-status" id="${id}_st">0%</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');
      xhr.setRequestHeader('Authorization', `Bearer ${_authToken}`);

      xhr.upload.onprogress = (e) => {
        if (!e.lengthComputable) return;
        const pct = Math.round(e.loaded / e.total * 100);
        const bar = document.getElementById(`${id}_bar`);
        const st  = document.getElementById(`${id}_st`);
        if (bar) bar.style.width = pct + '%';
        if (st)  st.textContent  = pct + '%';
      };

      xhr.onload = () => {
        const bar  = document.getElementById(`${id}_bar`);
        const st   = document.getElementById(`${id}_st`);
        const meta = card.querySelector('.fc-meta');
        const lbl  = card.querySelector('.fc-lbl');
        if (xhr.status === 200) {
          let savedName = file.name;
          try { savedName = JSON.parse(xhr.responseText).name || file.name; } catch {}
          const dlUrl = `/uploads/${encodeURIComponent(savedName)}?token=${encodeURIComponent(_authToken)}`;
          if (bar)  { bar.style.width = '100%'; bar.style.background = 'var(--green)'; }
          if (st)   { st.textContent = '✓'; st.className = 'fc-status done'; }
          if (lbl)  lbl.textContent = 'Sent';
          if (meta) meta.insertAdjacentHTML('beforeend',
            `<a class="fc-dl" href="${dlUrl}" download="${esc(savedName)}">⬇ Download back</a>`);
          toast('File sent!');
        } else {
          let errMsg = 'Upload failed';
          try { errMsg = JSON.parse(xhr.responseText).error || errMsg; } catch {}
          if (bar) bar.style.background = '#f87171';
          if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
          if (lbl) lbl.textContent = errMsg;
        }
      };

      xhr.onerror = () => {
        const st  = document.getElementById(`${id}_st`);
        const lbl = card.querySelector('.fc-lbl');
        if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
        if (lbl) lbl.textContent = 'Connection error';
      };

      const fd = new FormData();
      fd.append('file', file);
      xhr.send(fd);
    }

    // File received by another WebSocket client (e.g., second open tab)
    function _onFileReceived(m) {
      const dlUrl = `/uploads/${encodeURIComponent(m.name)}?token=${encodeURIComponent(_authToken)}`;
      const card  = document.createElement('div');
      card.className = 'msg-file';
      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(m.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Received</div>
          <div class="fc-name">${esc(m.name)}</div>
          <div class="fc-size">${_fmtSize(m.size)}</div>
          <a class="fc-dl" href="${dlUrl}" download="${esc(m.name)}">⬇ Download</a>
        </div>
        <div class="fc-status done">✓</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
      toast('File received on computer!');
    }

    // Second Brain upload notification for other connected clients (e.g. a second open tab)
    function _onSecondBrainReceived(m) {
      const card = document.createElement('div');
      card.className = 'msg-file sb';
      card.innerHTML = `
        <div class="fc-icon">🧠</div>
        <div class="fc-meta">
          <div class="fc-lbl">Second Brain</div>
          <div class="fc-name">${esc(m.name)}</div>
          <div class="fc-size">${_fmtSize(m.size)}</div>
        </div>
        <div class="fc-status done">🧠</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
      toast('Second Brain: RENCORA wertet aus…');
    }

    // File input change handler
    document.getElementById('file-inp').addEventListener('change', function () {
      Array.from(this.files).forEach(_uploadFile);
      this.value = ''; // reset so the same file can be re-sent
    });

    // ── Second Brain upload (phone → RENCORA wertet aus & merkt es sich) ───────
    function _uploadToSecondBrain(file) {
      const id = 'sb_' + Date.now() + '_' + Math.random().toString(36).slice(2);

      const card = document.createElement('div');
      card.className = 'msg-file sb';
      card.id = id;
      card.innerHTML = `
        <div class="fc-icon">🧠</div>
        <div class="fc-meta">
          <div class="fc-lbl">Second Brain</div>
          <div class="fc-name">${esc(file.name)}</div>
          <div class="fc-size">${_fmtSize(file.size)}</div>
          <div class="fc-bar-wrap"><div class="fc-bar" id="${id}_bar"></div></div>
        </div>
        <div class="fc-status" id="${id}_st">0%</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/secondbrain-upload');
      xhr.setRequestHeader('Authorization', `Bearer ${_authToken}`);

      xhr.upload.onprogress = (e) => {
        if (!e.lengthComputable) return;
        const pct = Math.round(e.loaded / e.total * 100);
        const bar = document.getElementById(`${id}_bar`);
        const st  = document.getElementById(`${id}_st`);
        if (bar) bar.style.width = pct + '%';
        if (st)  st.textContent  = pct + '%';
      };

      xhr.onload = () => {
        const bar = document.getElementById(`${id}_bar`);
        const st  = document.getElementById(`${id}_st`);
        const lbl = card.querySelector('.fc-lbl');
        if (xhr.status === 200) {
          if (bar) { bar.style.width = '100%'; bar.style.background = 'var(--accent)'; }
          if (st)  { st.textContent = '🧠'; st.className = 'fc-status done'; }
          if (lbl) lbl.textContent = 'Wird ausgewertet…';
          toast('RENCORA wertet die Datei aus…');
        } else {
          let errMsg = 'Upload failed';
          try { errMsg = JSON.parse(xhr.responseText).error || errMsg; } catch {}
          if (bar) bar.style.background = '#f87171';
          if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
          if (lbl) lbl.textContent = errMsg;
        }
      };

      xhr.onerror = () => {
        const st  = document.getElementById(`${id}_st`);
        const lbl = card.querySelector('.fc-lbl');
        if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
        if (lbl) lbl.textContent = 'Connection error';
      };

      const fd = new FormData();
      fd.append('file', file);
      xhr.send(fd);
    }

    document.getElementById('brain-inp').addEventListener('change', function () {
      Array.from(this.files).forEach(_uploadToSecondBrain);
      this.value = '';
    });

    // ── Commands ──────────────────────────────────────────────────────────────
    async function doSend() {
      const inp = document.getElementById('inp');
      const txt = inp.value.trim();
      if (!txt) return;
      inp.value = '';
      append('user', txt);
      await _cryptoInit;                 // ensure key derivation has finished
      const enc  = await _encrypt(txt);
      const body = enc ? { enc } : { text: txt };
      _authFetch('/api/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    }

    function doWake() {
      sys('Sending wake signal…');
      _authFetch('/api/wake', { method: 'POST' });
    }

    document.getElementById('inp').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
    });

    // ── Toast ─────────────────────────────────────────────────────────────────
    let _toastTimer;
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
    }

    // ── Header clock ──────────────────────────────────────────────────────────
    function _tickClock() {
      const el = document.getElementById('clock');
      if (!el) return;
      const now = new Date();
      el.textContent = now.toLocaleTimeString('de-DE', { hour12: false }) + '  ·  ' +
        now.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: 'short' });
    }
    _tickClock();
    setInterval(_tickClock, 1000);

    // ── System Monitor panel — polls the real host metrics ────────────────────
    const _GAUGE_CIRC = 163.36; // 2 * PI * r(26), matches the SVG ring radius
    function _setGauge(ringId, pct) {
      const ring = document.getElementById(ringId);
      if (!ring) return;
      const clamped = Math.max(0, Math.min(100, pct));
      ring.style.strokeDashoffset = _GAUGE_CIRC * (1 - clamped / 100);
    }

    // Netzwerk-Sparkline: haelt die letzten N Messwerte im Speicher und
    // zeichnet sie als Polyline neu — kein Chart-Framework noetig.
    const _NET_HISTORY = 30;
    let _netSentHist = [];
    let _netRecvHist = [];
    function _pointsFor(hist, maxVal) {
      const w = 200, h = 40;
      if (hist.length < 2) return '';
      const step = w / (_NET_HISTORY - 1);
      const start = _NET_HISTORY - hist.length;
      return hist.map((v, i) => {
        const x = (start + i) * step;
        const y = h - (maxVal > 0 ? (v / maxVal) * h : 0);
        return `${x.toFixed(1)},${Math.max(1, y).toFixed(1)}`;
      }).join(' ');
    }

    async function _pollSystemStatus() {
      try {
        const r = await _authFetch('/api/system-status');
        if (!r.ok) return;
        const d = await r.json();
        if (d.error) return;
        document.getElementById('m-cpu').textContent = d.cpu_percent + '%';
        _setGauge('m-cpu-ring', d.cpu_percent);
        document.getElementById('m-ram-pct').textContent = d.ram_percent + '%';
        _setGauge('m-ram-ring', d.ram_percent);
        document.getElementById('m-ram').textContent = d.ram_used_gb + ' / ' + d.ram_total_gb + ' GB';
        document.getElementById('m-temp').textContent = d.cpu_temp_c != null ? d.cpu_temp_c + '°C' : 'N/A';
        document.getElementById('m-uptime').textContent = d.uptime;
        document.getElementById('m-procs').textContent = d.process_count;

        const gpuEl = document.getElementById('m-gpu-pct');
        if (d.gpu_percent != null) {
          gpuEl.textContent = d.gpu_percent + '%';
          _setGauge('m-gpu-ring', d.gpu_percent);
        } else {
          gpuEl.textContent = 'N/A';
          _setGauge('m-gpu-ring', 0);
        }

        const sent = d.net_sent_kbps ?? 0, recv = d.net_recv_kbps ?? 0;
        _netSentHist.push(sent); if (_netSentHist.length > _NET_HISTORY) _netSentHist.shift();
        _netRecvHist.push(recv); if (_netRecvHist.length > _NET_HISTORY) _netRecvHist.shift();
        const maxVal = Math.max(10, ..._netSentHist, ..._netRecvHist);
        document.getElementById('net-spark-sent').setAttribute('points', _pointsFor(_netSentHist, maxVal));
        document.getElementById('net-spark-recv').setAttribute('points', _pointsFor(_netRecvHist, maxVal));
        document.getElementById('net-sent').textContent = sent.toFixed(1) + ' KB/s';
        document.getElementById('net-recv').textContent = recv.toFixed(1) + ' KB/s';
      } catch (e) { /* silent — keeps last known values on transient errors */ }
    }
    _pollSystemStatus();
    setInterval(_pollSystemStatus, 4000);

    // ── World Map panel — fullscreen toggle ────────────────────────────────────
    document.getElementById('map-full-btn').addEventListener('click', () => {
      const frame = document.getElementById('globe-frame');
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else if (frame.requestFullscreen) {
        frame.requestFullscreen();
      }
    });

    // ── Real-time Voice — PCM16 WebSocket → Gemini Live ──────────────────────
    const micBtn  = document.getElementById('mic-btn');
    let _voiceWs  = null;
    let _audioCtx = null;
    let _micStm   = null;
    let _audioNd  = null;

    function _micIdle() {
      micBtn.innerHTML = '🎤';
      micBtn.title     = 'Voice — tap to speak';
      micBtn.classList.remove('recording');
    }

    // Float32 PCM → resample to 16 kHz + convert to Int16
    function _f32toPcm16(f32, srcRate) {
      let s = f32;
      if (srcRate !== 16000) {
        const ratio = srcRate / 16000;
        const len   = Math.round(f32.length / ratio);
        s = new Float32Array(len);
        for (let i = 0; i < len; i++)
          s[i] = f32[Math.min(Math.round(i * ratio), f32.length - 1)];
      }
      const out = new Int16Array(s.length);
      for (let i = 0; i < s.length; i++)
        out[i] = Math.max(-32768, Math.min(32767, Math.round(s[i] * 32768)));
      return out.buffer;
    }

    function _showVoiceSetup() {
      if (document.getElementById('voice-setup')) return; // show once
      const origin = location.origin;
      const card = document.createElement('div');
      card.id = 'voice-setup';
      card.style.cssText = [
        'align-self:stretch', 'background:rgba(99,102,241,0.07)',
        'border:1px solid rgba(99,102,241,0.22)', 'border-radius:14px',
        'padding:16px 18px', 'font-size:13px', 'line-height:1.8',
        'animation:pop 0.18s ease'
      ].join(';');
      card.innerHTML =
        '<div style="font-weight:700;color:#818cf8;letter-spacing:.5px;margin-bottom:10px">🎤 One-time voice setup</div>' +
        '<ol style="padding-left:18px;color:#8899aa;margin:0;display:flex;flex-direction:column;gap:4px">' +
        '<li>Open a new tab → go to <span style="background:rgba(255,255,255,0.07);padding:1px 6px;border-radius:4px;font-family:monospace;font-size:12px">chrome://flags</span></li>' +
        '<li>Search: <strong style="color:#dde3ed">Insecure origins treated as secure</strong></li>' +
        '<li>Paste this URL into the box:<br><span id="flags-url" style="background:rgba(255,255,255,0.07);padding:2px 8px;border-radius:4px;font-family:monospace;font-size:11px;user-select:all;cursor:pointer">' + esc(origin) + '</span></li>' +
        '<li>Set to <strong style="color:#22c55e">Enabled</strong> → tap <strong style="color:#dde3ed">Relaunch</strong></li>' +
        '<li>Return here and tap 🎤</li>' +
        '</ol>';
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
      // tap to copy
      card.querySelector('#flags-url').addEventListener('click', () => {
        navigator.clipboard?.writeText(origin).then(() => toast('URL copied!')).catch(() => {});
      });
    }

    async function doMic() {
      if (_voiceWs) { _stopVoice(); return; }

      if (!navigator.mediaDevices?.getUserMedia) {
        _showVoiceSetup();
        return;
      }
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
        });
      } catch (e) {
        sys(e.name === 'NotAllowedError'
          ? 'Microphone denied — tap the address bar lock and allow microphone.'
          : 'Mic error: ' + e.message);
        return;
      }

      // 16 kHz context (fall back to native rate — _f32toPcm16 resamples)
      let ctx;
      try { ctx = new AudioContext({ sampleRate: 16000 }); }
      catch (_) { ctx = new AudioContext(); }
      if (ctx.state === 'suspended') await ctx.resume();

      const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(
        `${wsProto}://${location.host}/ws/phone-audio?token=${encodeURIComponent(_authToken)}`
      );
      ws.binaryType = 'arraybuffer';

      ws.onopen = async () => {
        const rate = ctx.sampleRate;
        const src  = ctx.createMediaStreamSource(stream);

        // AudioWorklet (modern) — runs in dedicated audio thread
        const wCode = `class J extends AudioWorkletProcessor{process(i){const c=i[0]?.[0];if(c)this.port.postMessage(c.slice());return true;}}registerProcessor('j',J);`;
        try {
          const burl = URL.createObjectURL(new Blob([wCode], { type: 'application/javascript' }));
          await ctx.audioWorklet.addModule(burl);
          URL.revokeObjectURL(burl);
          const nd = new AudioWorkletNode(ctx, 'j');
          // Buffer to 1024 samples (64 ms at 16 kHz) before sending —
          // matches PC mic chunk size, prevents queue flooding on the server.
          let _pbuf = [], _plen = 0;
          nd.port.onmessage = e => {
            const chunk = new Int16Array(_f32toPcm16(e.data, rate));
            _pbuf.push(chunk); _plen += chunk.length;
            if (_plen >= 1024) {
              const out = new Int16Array(_plen); let off = 0;
              for (const c of _pbuf) { out.set(c, off); off += c.length; }
              if (ws.readyState === 1) ws.send(out.buffer);
              _pbuf = []; _plen = 0;
            }
          };
          src.connect(nd);
          _audioNd = nd;
        } catch (_) {
          // ScriptProcessor fallback (deprecated, still works everywhere)
          const sp = ctx.createScriptProcessor(4096, 1, 1);
          sp.onaudioprocess = e => {
            if (ws.readyState === 1) ws.send(_f32toPcm16(e.inputBuffer.getChannelData(0), rate));
          };
          src.connect(sp); sp.connect(ctx.destination);
          _audioNd = sp;
        }

        micBtn.innerHTML = '⏹';
        micBtn.title     = 'Tap to stop';
        micBtn.classList.add('recording');
        sys('Voice live — speak now');
        toast('🎤 Live');
      };

      ws.onclose = () => { _stopVoice(); };
      ws.onerror = () => { sys('Voice connection failed.'); _stopVoice(); };

      _voiceWs  = ws;
      _audioCtx = ctx;
      _micStm   = stream;
    }

    function _stopVoice() {
      if (_audioNd)  { try { _audioNd.disconnect(); }  catch (_) {}; _audioNd  = null; }
      if (_audioCtx) { try { _audioCtx.close(); }      catch (_) {}; _audioCtx = null; }
      if (_micStm)   { _micStm.getTracks().forEach(t => t.stop()); _micStm = null; }
      if (_voiceWs)  {
        const w = _voiceWs; _voiceWs = null;
        if (w.readyState < 2) w.close();
      }
      _micIdle();
    }
  </script>
