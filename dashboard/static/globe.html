<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SATELLITEN // WELT-NETZ — RENCORA</title>
<style>
  :root { --amber:#00ff41; --amber-dim:#1a5c1a; --bg:#000a00; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--amber); font-family:"JetBrains Mono","Consolas",monospace; overflow:hidden; height:100vh; }
  #globe { position:absolute; inset:0; }
  header { position:absolute; top:0; left:0; right:0; padding:14px 22px; display:flex; justify-content:space-between; z-index:5;
           background:linear-gradient(180deg, rgba(0,10,0,.92), transparent); letter-spacing:.18em; font-size:13px; }
  header .live { color:#ff4433; animation:blink 1.4s infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  #panel { position:absolute; left:22px; top:90px; z-index:5; max-width:340px; }
  #panel h1 { font-size:26px; letter-spacing:.1em; text-shadow:0 0 18px rgba(0,255,65,.5); }
  #panel .sub { color:var(--amber-dim); font-size:11px; margin-top:6px; letter-spacing:.14em; }
  #panel .headline { margin-top:14px; font-size:13px; line-height:1.5; color:#afffaf;
                     border-left:2px solid var(--amber); padding-left:10px; min-height:60px; }
  #news { position:absolute; right:0; top:60px; bottom:0; width:300px; z-index:5; overflow-y:auto; padding:10px;
          background:linear-gradient(270deg, rgba(0,10,0,.85), transparent); }
  #news a { display:block; color:#afffaf; text-decoration:none; font-size:11px; line-height:1.45;
            border:1px solid rgba(0,255,65,.25); border-radius:4px; padding:9px; margin-bottom:9px;
            background:rgba(0,25,10,.55); transition:border-color .2s; }
  #news a:hover { border-color:var(--amber); }
  #news .meta { display:flex; align-items:center; gap:6px; margin-bottom:5px; }
  #news .src { color:var(--amber-dim); font-size:9px; letter-spacing:.12em; }
  #news .bias { font-size:8px; letter-spacing:.1em; font-weight:bold; padding:1px 6px;
                border-radius:99px; text-transform:uppercase; }
  #countries { position:absolute; left:22px; bottom:22px; z-index:5; display:flex; gap:8px; }
  #countries button { background:rgba(0,25,10,.7); color:var(--amber); border:1px solid rgba(0,255,65,.35);
                      font:inherit; font-size:11px; letter-spacing:.14em; padding:7px 14px; border-radius:3px; cursor:pointer; }
  #countries button.active { background:var(--amber); color:#001a05; font-weight:bold; }
  ::-webkit-scrollbar { width:5px; } ::-webkit-scrollbar-thumb { background:var(--amber-dim); }
</style>
</head>
<body>
<div id="globe"></div>
<header>
  <span>SATELLITEN&nbsp;//&nbsp;WELT-NETZ</span>
  <span class="live">● LIVE</span>
  <span id="clock"></span>
</header>
<div id="panel">
  <h1 id="country-name">DEUTSCHLAND</h1>
  <div class="sub" id="coords">51.16° N&nbsp;&nbsp;10.45° O</div>
  <div class="headline" id="headline">Lade aktuelle Meldungen…</div>
</div>
<div id="news"></div>
<div id="countries">
  <button data-c="de" class="active">DEUTSCHLAND</button>
  <button data-c="ru">RUSSLAND</button>
  <button data-c="us">USA</button>
  <button data-c="cn">CHINA</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
// Farbschema vom Server anwenden (gleiche Quelle wie das Haupt-Dashboard)
fetch('/api/theme').then(r => r.json()).then(t => {
  const s = document.documentElement.style;
  if (t.PRI)      s.setProperty('--amber', t.PRI);
  if (t.BG)       s.setProperty('--bg', t.BG);
  if (t.TEXT_DIM) s.setProperty('--amber-dim', t.TEXT_DIM);
}).catch(() => {});

const COUNTRIES = {
  de: { name:"DEUTSCHLAND", lat:51.16, lon:10.45, coords:"51.16° N  10.45° O" },
  ru: { name:"RUSSLAND",    lat:61.52, lon:105.3, coords:"61.52° N  105.30° O" },
  us: { name:"USA",         lat:39.83, lon:-98.6, coords:"39.83° N  98.58° W" },
  cn: { name:"CHINA",       lat:35.86, lon:104.2, coords:"35.86° N  104.20° O" },
};
// Uhr
setInterval(()=>{ document.getElementById("clock").textContent =
  new Date().toLocaleTimeString("de-DE"); }, 1000);

// ── Globus (three.js: Drahtgitter-Erde + Satelliten-Punkte) ──────────────
const container = document.getElementById("globe");
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, .1, 100);
camera.position.z = 3.1;
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setSize(innerWidth, innerHeight);
container.appendChild(renderer.domElement);

const globe = new THREE.Group();
scene.add(globe);
globe.add(new THREE.Mesh(
  new THREE.SphereGeometry(1, 48, 48),
  new THREE.MeshBasicMaterial({ color:0x041a0d })));
globe.add(new THREE.LineSegments(
  new THREE.WireframeGeometry(new THREE.SphereGeometry(1.001, 36, 24)),
  new THREE.LineBasicMaterial({ color:0x00ff41, transparent:true, opacity:.16 })));

function latLonToVec(lat, lon, r=1) {
  const phi=(90-lat)*Math.PI/180, theta=(lon+180)*Math.PI/180;
  return new THREE.Vector3(-r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
}
// Marker pro Land
const markers = {};
for (const [key,c] of Object.entries(COUNTRIES)) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(.022, 12, 12),
    new THREE.MeshBasicMaterial({ color:0x00ff41 }));
  m.position.copy(latLonToVec(c.lat, c.lon, 1.01));
  globe.add(m); markers[key]=m;
}
// Satelliten-Punkte auf Umlaufbahnen
const sats = [];
for (let i=0;i<14;i++){
  const s = new THREE.Mesh(new THREE.SphereGeometry(.012,8,8),
    new THREE.MeshBasicMaterial({ color:0x9dffb0 }));
  s.userData = { r:1.25+Math.random()*.5, speed:.15+Math.random()*.35,
                 phase:Math.random()*Math.PI*2, tilt:Math.random()*Math.PI };
  scene.add(s); sats.push(s);
}
let targetRotY = 0;
function focusCountry(key){
  const c = COUNTRIES[key];
  targetRotY = -((c.lon+180)*Math.PI/180) - Math.PI/2;
  document.getElementById("country-name").textContent = c.name;
  document.getElementById("coords").textContent = c.coords;
  Object.values(markers).forEach(m=>m.scale.setScalar(1));
  markers[key].scale.setScalar(2.2);
  loadNews(key);
  document.querySelectorAll("#countries button").forEach(b=>
    b.classList.toggle("active", b.dataset.c===key));
}
document.querySelectorAll("#countries button").forEach(b=>
  b.addEventListener("click", ()=>focusCountry(b.dataset.c)));

const clock = new THREE.Clock();
(function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  globe.rotation.y += (targetRotY - globe.rotation.y)*.04 + .0006;
  sats.forEach(s=>{
    const u=s.userData, a=t*u.speed+u.phase;
    s.position.set(Math.cos(a)*u.r, Math.sin(a)*Math.sin(u.tilt)*u.r*.4, Math.sin(a)*u.r);
  });
  renderer.render(scene, camera);
})();
addEventListener("resize", ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── News: laedt Schlagzeilen ueber den RENCORA-Server (Proxy-Endpunkt) ────
function _esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

async function loadNews(key){
  const box = document.getElementById("news");
  box.innerHTML = "<a>Lade Meldungen…</a>";
  try {
    const r = await fetch(`/api/globe-news?country=${key}`);
    const items = await r.json();
    if (!items.length) { box.innerHTML="<a>Keine Meldungen gefunden.</a>"; return; }
    document.getElementById("headline").textContent = items[0].title;
    box.innerHTML = items.map(n=>{
      const orig = n.original_title ? ` title="Original: ${_esc(n.original_title)}"` : "";
      return `<a href="${n.link}" target="_blank" rel="noopener"${orig}>
         <span class="meta">
           <span class="src">${_esc(n.source)}</span>
           <span class="bias" style="background:${n.bias_color || '#9dffb0'}22; color:${n.bias_color || '#9dffb0'}; border:1px solid ${n.bias_color || '#9dffb0'}55;">${_esc(n.bias || '')}</span>
         </span>${_esc(n.title)}</a>`;
    }).join("");
  } catch(e) {
    box.innerHTML = "<a>News-Abruf fehlgeschlagen (offline?).</a>";
  }
}
focusCountry("de");
</script>
</body>
</html>
