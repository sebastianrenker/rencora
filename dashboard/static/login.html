<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RENCORA</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=JetBrains+Mono:wght@400;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── SCANLINES ── */
    body::after {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 9999;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0.10) 0px, rgba(0,0,0,0.10) 1px,
        transparent 1px, transparent 3px
      );
    }
    /* ── AMBIENT HUD GRID ── */
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(0,255,65,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,65,0.05) 1px, transparent 1px);
      background-size: 42px 42px;
      -webkit-mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 70%);
              mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 70%);
    }
    :root {
      --bg:     #000a00;
      --card:   rgba(0,28,10,0.55);
      --border: rgba(0,255,65,0.18);
      --accent: #00ff41;
      --accent2:#00c853;
      --adim:   rgba(0,255,65,0.15);
      --text:   #afffaf;
      --muted:  #2a5e2a;
    }
    html, body {
      height: 100%;
      background:
        radial-gradient(1200px 700px at 50% 15%, rgba(0,255,65,0.08), transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      position: relative;
      z-index: 1;
      width: 340px;
      padding: 44px 36px;
      background: var(--card);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      border: 1px solid var(--border);
      clip-path: polygon(0 18px, 18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%);
      text-align: center;
      box-shadow: 0 0 40px rgba(0,255,65,0.12), inset 0 0 30px rgba(0,40,0,0.35);
    }
    .card::before, .card::after {
      content: '';
      position: absolute;
      width: 22px; height: 22px;
      border: 2px solid var(--accent);
      opacity: 0.75;
      filter: drop-shadow(0 0 6px rgba(0,255,65,0.7));
    }
    .card::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
    .card::after  { bottom: -1px; right: -1px; border-left: none; border-top: none; }
    .brandline {
      font-family: 'Orbitron', 'JetBrains Mono', sans-serif;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 4px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    .logo {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin-bottom: 6px;
    }
    .logo img { width: 40px; height: 40px; object-fit: contain; }
    .logo .logo-text {
      font-family: 'Orbitron', 'JetBrains Mono', sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 7px;
      text-shadow: 0 0 14px rgba(0,255,65,0.6);
    }
    .logo em { color: var(--accent); font-style: normal; text-shadow: 0 0 18px rgba(0,255,65,0.9); }
    .sub {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .hint {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 28px;
    }
    .key-wrap {
      position: relative;
      margin-bottom: 16px;
    }
    .key-input {
      width: 100%;
      padding: 18px 14px;
      background: rgba(255,255,255,0.05);
      border: 1.5px solid var(--border);
      clip-path: polygon(0 10px, 10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
      color: var(--text);
      font-size: 30px;
      font-weight: 700;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      text-align: center;
      letter-spacing: 10px;
      text-transform: uppercase;
      outline: none;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
      caret-color: var(--accent);
    }
    .key-input::placeholder {
      color: rgba(94,106,126,0.5);
      letter-spacing: 6px;
      font-size: 20px;
    }
    .key-input:focus {
      border-color: var(--accent);
      background: var(--adim);
      box-shadow: 0 0 0 3px rgba(0,255,65,0.14), 0 0 20px rgba(0,255,65,0.15);
    }
    .err {
      font-size: 12px;
      color: #f87171;
      min-height: 18px;
      margin-bottom: 14px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #001a00;
      font-size: 12px;
      font-weight: 800;
      font-family: 'Orbitron', 'JetBrains Mono', sans-serif;
      letter-spacing: 3px;
      border: none;
      clip-path: polygon(0 10px, 10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
      cursor: pointer;
      box-shadow: 0 0 18px rgba(0,255,65,0.35);
      transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
    }
    .btn:hover  { opacity: 0.92; box-shadow: 0 0 26px rgba(0,255,65,0.55); }
    .btn:active { transform: scale(0.98); }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-7px); }
      40%,80% { transform: translateX(7px); }
    }
    .shake { animation: shake 0.35s ease; }
    .voice-note {
      font-size: 10px;
      color: var(--muted);
      margin-top: 20px;
      line-height: 1.6;
      text-align: left;
    }
    .voice-note code {
      background: rgba(255,255,255,0.07);
      padding: 1px 4px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 9px;
    }
    #reconnecting {
      display: none;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="brandline">Renker Industries</div>
    <div class="logo">
      <img src="/static/icons/rencora_icon.png" alt="Rencora">
      <div class="logo-text"><span class="title">REN<em>CORA</em></span></div>
    </div>
    <div class="sub">Remote Access</div>
    <p id="reconnecting">Reconnecting…</p>
    <p class="hint">Press <strong style="color:var(--text)">Remote Control</strong> in the RENCORA desktop app to get a QR code or session key.</p>
    <div class="key-wrap">
      <input class="key-input" id="key" type="text" maxlength="6"
             autocomplete="off" autocorrect="off" spellcheck="false"
             placeholder="· · · · · ·">
    </div>
    <div class="err" id="err"></div>
    <button class="btn" onclick="doLogin()">CONNECT</button>
    <p class="voice-note">
      🎤 <strong style="color:var(--text)">Voice commands:</strong> open
      <code>chrome://flags</code> on your phone, search
      <code>Insecure origins treated as secure</code>, add your RENCORA URL, tap Relaunch.
    </p>
  </div>

  <script>
    // Try auto-reconnect with stored device token (set on first QR login)
    (async function() {
      const devTok = localStorage.getItem('rencora_device_token');
      if (!devTok) return;
      document.getElementById('reconnecting').style.display = 'block';
      try {
        const r = await fetch('/api/device-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ device_token: devTok }),
        });
        const d = await r.json();
        if (d.ok && d.token) {
          sessionStorage.setItem('rencora_key', d.key);
          sessionStorage.setItem('rencora_token', d.token);
          location.replace('/');
          return;
        }
      } catch (_) {}
      // Device token rejected (server restarted) — clear it and show normal form
      localStorage.removeItem('rencora_device_token');
      document.getElementById('reconnecting').style.display = 'none';
    })();

    const inp = document.getElementById('key');
    inp.focus();

    inp.addEventListener('input', () => {
      inp.value = inp.value.toUpperCase().replace(/[^A-Z2-9]/g, '');
      if (inp.value.length === 6) doLogin();
    });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    async function doLogin() {
      const key = inp.value.trim();
      if (key.length < 6) { shake(); return; }
      let data;
      try {
        const r = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: key })
        });
        data = await r.json();
      } catch (e) {
        document.getElementById('err').textContent = 'Connection error';
        shake(); return;
      }
      if (data.ok && data.token) {
        sessionStorage.setItem('rencora_key', key);
        sessionStorage.setItem('rencora_token', data.token);
        location.href = '/';
      } else {
        inp.value = '';
        inp.focus();
        document.getElementById('err').textContent = 'Invalid or expired key';
        shake();
      }
    }

    function shake() {
      const c = document.getElementById('card');
      c.classList.remove('shake');
      void c.offsetWidth;
      c.classList.add('shake');
    }
  </script>
</body>
</html>
